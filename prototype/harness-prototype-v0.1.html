<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names = {pending:'待运行',preparing:'准备环境',running:'执行中',done:'已完成',blocked:'已阻塞',waiting:'等待上游'};
const pill = s => '<span class="badge '+s+'"><span class="dot"></span>'+(names[s] || s)+'</span>';
const money = n => '$'+n.toFixed(3);
const unit = (name,role) => ({name,role,prompt:role==='reviewer'?'检查代码改动与任务目标。通过时返回通过；有问题时提交具体修改意见。':'完成当前步骤，记录结果与交接信息。'});
const templates = {
 code:()=>[unit('preparation','planner'),unit('coding','coder')],
 review:()=>[unit('preparation','planner'),unit('coding','coder'),unit('review','reviewer')],
 simple:()=>[unit('execute','agent')]
};
function task(id,title,desc,deps,template='review'){
 return {id,title,desc,deps,units:templates[template](),worktree:true,check:'',maxRounds:3,backTo:1,status:'pending',phase:'',index:0,round:1,ticks:0,seconds:0,cost:0,completed:[],sessionId:null,reason:'',fixed:false,x:0,y:0};
}
function initial(){
 return {started:false,running:false,clock:0,run:1,scenario:'review',concurrency:2,events:[],sessions:[],tasks:[
 task('T01','梳理需求与接口契约','梳理登录流程，明确接口输入、错误状态与验收条件。',[],'code'),
 task('T02','实现认证接口','实现登录与会话校验，并根据审查反馈完成修复。',['T01']),
 task('T03','构建登录页面','实现表单、加载状态、错误提示与登录后的跳转。',['T01']),
 task('T04','集成与验收','合并认证接口和页面改动，完成登录流程的集成验收。',['T02','T03'],'code'),
 task('T05','补充使用文档','整理接口约定与本地启动说明，可与功能开发并行。',['T01'],'simple')
 ],messages:[{who:'agent',text:'我们先为登录功能创建一个任务图。\n接口与页面可以并行，集成任务等待两者完成。你可以在右侧任务图检查 Unit 流程，然后启动运行。'}]};
}
let state=initial(),page='graph',selected='T02',view='canvas',tab='units',openUnit=-1,traceFilter='all',zoom=1,timer=null,toastTimer=null,chatSession='main';
function current(){return state.tasks.find(t=>t.id===selected)||state.tasks[0]}
function statusOf(t){return t.status==='pending' && t.deps.some(id=>{const d=state.tasks.find(x=>x.id===id);return d.status==='blocked'||statusOf(d)==='waiting'})?'waiting':t.status}
function totals(){return {cost:state.tasks.reduce((a,t)=>a+t.cost,0),done:state.tasks.filter(t=>t.status==='done').length,calls:state.events.filter(e=>e.type==='tool').length}}
function graphStatus(){if(!state.started)return 'pending';if(state.tasks.every(t=>t.status==='done'))return 'done';if(state.tasks.some(t=>t.status==='blocked')&&!state.tasks.some(t=>['running','preparing'].includes(t.status)))return 'blocked';return state.running?'running':'已暂停'}
function log(t,message,type='event',detail='',cost=0,seconds=0){
 state.events.unshift({id:state.events.length+1,task:t?t.id:'GRAPH',unit:t&&t.phase==='unit'?t.units[t.index].name:'scheduler',time:state.clock,message,type,detail,cost,seconds,session:t?t.sessionId:null});
}
function beginUnit(t){
 t.phase='unit';t.status='running';t.ticks=0;t.sessionId='s-'+String(state.sessions.length+1).padStart(3,'0');
 const u=t.units[t.index];state.sessions.push({id:t.sessionId,task:t.id,unit:u.name,role:u.role,round:t.round,status:'running',cost:0,seconds:0});
 log(t,'启动 '+u.name+' · 第 '+t.round+' 轮','event','独立模拟 session '+t.sessionId);
}
function schedule(){
 let active=state.tasks.filter(t=>['running','preparing'].includes(t.status));
 for(const t of state.tasks){
  if(active.length>=state.concurrency)break;
  if(t.status!=='pending'||!t.deps.every(id=>state.tasks.find(x=>x.id===id).status==='done'))continue;
  if(!t.worktree&&active.some(x=>!x.worktree))continue;

  log(t,t.deps.length?'开始合并依赖 '+t.deps.join(' + '):'从 graph 基准准备 worktree','event',t.worktree?'worktrees/'+t.id:'worktrees/graph-base');

function advance(){
 if(state.started&&!state.tasks.some(t=>['preparing','running'].includes(t.status))&&!state.tasks.some(t=>t.status==='pending'&&t.deps.every(id=>state.tasks.find(x=>x.id===id).status==='done')))return;
 state.started=true;state.clock++;
 for(const t of state.tasks.filter(x=>['preparing','running'].includes(x.status))){
  t.seconds+=8;
  if(t.phase==='merge'){
   if(t.id==='T04'&&state.scenario==='conflict'&&!t.fixed){block(t,'合并冲突 · src/auth/session.ts');continue}
   t.phase='check';log(t,'依赖合并通过，开始启动检查','event',t.check||'Git 合并完整性检查');continue;
  }
  if(t.phase==='check'){
   if(t.id==='T04'&&state.scenario==='check'&&!t.fixed){block(t,'启动检查失败 · 登录集成测试未通过');continue}
   log(t,'启动检查通过');beginUnit(t);continue;
  }
  t.ticks++;const u=t.units[t.index],s=state.sessions.find(x=>x.id===t.sessionId);
  s.seconds+=8;
  if(t.ticks===1){
   const tool=u.role==='coder'?'apply_patch':u.role==='reviewer'?'exec_command':'read_file';
   const fee=u.role==='coder'?.012:.006;t.cost+=fee;s.cost+=fee;
   log(t,tool,'tool',u.role==='coder'?'修改 src/auth/session.ts\n+ export function createSession(credentials) { … }\n模拟输出：文件修改成功。':u.role==='reviewer'?'npm run test:auth\n模拟输出：检查实现、测试结果和任务验收条件。':'读取 README.md 与任务说明。\n模拟输出：已提取接口约束和交接信息。',fee,8);
  }
  if(t.ticks<(u.role==='coder'?3:2))continue;
  s.status='done';t.completed.push(t.index);
  if(u.role==='reviewer'&&state.scenario==='review'&&t.id==='T02'&&t.round===1){
   log(t,'Review 要求修改：补充过期 session 的处理','review','反馈交给 coding，preparation 不重复。');
   if(t.round>=t.maxRounds){block(t,'达到循环上限 · 审查仍未通过');continue}
   t.round++;t.index=Math.min(t.backTo,t.index-1);t.completed=t.completed.filter(i=>i<t.index);beginUnit(t);continue;
  }
  log(t,u.role==='reviewer'?'Review 通过':u.name+' 已完成');
  if(t.index<t.units.length-1){t.index++;beginUnit(t)}
  else{t.status='done';t.phase='done';t.sessionId=null;log(t,'任务完成，交付版本 demo/'+t.id.toLowerCase(),'event',t.desc+'\n模拟结果已可供下游任务合并。')}
 }
 schedule();
 if(state.tasks.every(t=>t.status==='done')||!state.tasks.some(t=>['preparing','running'].includes(t.status)))state.running=false;
}

 $('#page').innerHTML=page==='graph'?graphPage():page==='sessions'?sessionPage():page==='files'?filesPage():top('运行记录','每一轮、每个 Unit、每次调用都可以单独查看。', '<button class="btn" data-action="export">↓ 导出记录</button>','OBSERVABILITY')+metrics()+tracePanel(true)+foot();
 if(scroll&&$('#canvas')){$('#canvas').scrollLeft=scroll.x;$('#canvas').scrollTop=scroll.y}
 if(focused&&focusId&&document.getElementById(focusId)){const next=document.getElementById(focusId);next.value=value;next.focus()}
}
function dialog(title,body,footer){$('#modal').innerHTML='<header><div class="row spread"><h2>'+title+'</h2><button data-action="close" aria-label="关闭">✕</button></div></header><section>'+body+'</section><footer>'+(footer||'<button class="btn" data-action="close">关闭</button>')+'</footer>';$('#modal').showModal()}
function addTaskDialog(){dialog('添加 Task','<div class="form-row"><label class="label">任务名称</label><input id="newTitle" class="field" placeholder="例如：补充端到端测试" maxlength="40"></div><div class="form-row"><label class="label">执行流程</label><select id="newTemplate" class="field"><option value="review">preparation → coding → review ↶</option><option value="code">preparation → coding</option><option value="simple">单个 Unit</option></select></div><div class="form-row"><label class="label">依赖任务 · 可多选</label><div class="checks">'+state.tasks.map(t=>'<label class="checkitem"><input type="checkbox" name="dep" value="'+t.id+'"> '+t.id+' '+esc(t.title)+'</label>').join('')+'</div></div><p class="config-note">新任务只能依赖已有任务，演示中不会产生 DAG 回环。</p>','<button class="btn" data-action="close">取消</button><button class="btn primary" data-action="createTask">添加到图中</button>')}
function addUnitDialog(){dialog('添加 Unit','<div class="form-row"><label class="label">步骤名称</label><input id="newUnitName" class="field" placeholder="例如：documentation"></div><div class="form-row"><label class="label">执行角色</label><select id="newRole" class="field"><option value="agent">通用 agent</option><option value="coder">Coder</option><option value="reviewer">Reviewer</option></select></div><p class="config-note">添加到当前 Task 的末尾。Unit 引用子 Graph 暂未在此原型中实现。</p>','<button class="btn" data-action="close">取消</button><button class="btn primary" data-action="createUnit">添加 Unit</button>')}
document.addEventListener('click',e=>{
 if(e.target.closest('input,textarea,select,label,a'))return;
 const pageEl=e.target.closest('[data-page]');if(pageEl){page=pageEl.dataset.page;render();return}
 const taskEl=e.target.closest('[data-task]');if(taskEl){selected=taskEl.dataset.task;openUnit=-1;render();return}
 const tabEl=e.target.closest('[data-tab]');if(tabEl){tab=tabEl.dataset.tab;render();return}
 const viewEl=e.target.closest('[data-view]');if(viewEl){view=viewEl.dataset.view;render();return}
 const scenarioEl=e.target.closest('[data-scenario]');if(scenarioEl){reset(scenarioEl.dataset.scenario);notify('已切换场景：'+scenarioNames[state.scenario]);return}
 const sessionEl=e.target.closest('[data-session]');if(sessionEl){chatSession=sessionEl.dataset.session;page='sessions';render();return}
 const fileEl=e.target.closest('[data-file]');if(fileEl){const name=fileEl.dataset.file;$('#fileTitle').textContent=name;$('#fileContent').textContent=typeof fileContents[name]==='function'?fileContents[name]():fileContents[name];return}
 const eventEl=e.target.closest('[data-event]');if(eventEl){const ev=state.events.find(x=>x.id===Number(eventEl.dataset.event));dialog(esc(ev.message),'<div class="detail-grid"><p><span class="label">任务 / Unit</span>'+ev.task+' / '+esc(ev.unit)+'</p><p><span class="label">Session</span>'+esc(ev.session||'调度器')+'</p><p><span class="label">模拟耗时</span>'+ev.seconds+'s</p><p><span class="label">模拟费用</span>'+money(ev.cost)+'</p></div><div class="log-detail">'+esc(ev.detail||ev.message).replace(/\n/g,'<br>')+'</div><p class="config-note" style="margin-top:12px">演示数据。未执行真实工具，也未产生模型费用。</p>');return}
 const actionEl=e.target.closest('[data-action]');
 if(actionEl){const a=actionEl.dataset.action,t=current();
  if(a==='run'){state.running?pause():start();render()}
  if(a==='reset')reset();
  if(a==='step'){pause();advance();render()}
  if(a==='close')$('#modal').close();
  if(a==='zoomin'||a==='zoomout'){zoom=Math.max(.6,Math.min(1.3,Math.round((zoom+(a==='zoomin'?.1:-.1))*10)/10));render()}
  if(a==='addTask')addTaskDialog();
  if(a==='createTask'){const title=$('#newTitle').value.trim();if(!title){$('#newTitle').focus();return}const id='T'+String(state.tasks.length+1).padStart(2,'0'),deps=[...document.querySelectorAll('input[name="dep"]:checked')].map(x=>x.value);state.tasks.push(task(id,title,'完成 '+title+'，并交付可供下游使用的结果。',deps,$('#newTemplate').value));selected=id;$('#modal').close();render();notify('已添加 '+id+'，依赖连线已更新')}
  if(a==='addUnit')addUnitDialog();
  if(a==='createUnit'){const name=$('#newUnitName').value.trim();if(!name){$('#newUnitName').focus();return}const role=$('#newRole').value;if(role==='reviewer'&&t.backTo>=t.units.length)t.backTo=Math.max(0,t.units.length-1);t.units.push(unit(name,role));$('#modal').close();render()}
  if(a==='saveUnit'){t.units[openUnit].prompt=$('#unitPrompt').value;notify('Unit 指令已保存到本次演示');return}
  if(a==='saveConfig'){
   const max=Number($('#maxRounds').value),back=Number($('#backTo').value),review=t.units.findIndex(u=>u.role==='reviewer');
   if(!Number.isInteger(max)||max<1||max>10){notify('最大循环轮数需为 1 到 10 的整数');return}
   if(review>=0&&back>=review){notify('Review 回跳目标必须位于 reviewer 之前');return}
   t.desc=$('#taskDesc').value;t.worktree=$('#worktree').checked;t.check=$('#checkCmd').value;t.maxRounds=max;t.backTo=back;render();notify('任务配置已保存到本次演示');
  }
  if(a==='resolve'){t.fixed=true;t.reason='';if(t.phase==='unit'){t.round=1;t.index=0;t.completed=[];t.maxRounds=Math.max(2,t.maxRounds)}t.status='pending';t.phase='';log(t,'用户模拟解决阻塞，等待重新校验');start();notify('将重新合并与校验，再继续执行')}
  if(a==='export'){const blob=new Blob([JSON.stringify({prototype:true,actual_cost:false,scenario:state.scenario,tasks:state.tasks,sessions:state.sessions,events:state.events},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='harness-prototype-run.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('已导出演示运行记录')}
  if(a==='mainChat'){chatSession='main';page='sessions';render()}
  if(a==='chatGraph'){page='graph';render()}
  if(a==='send'){const text=$('#chatInput').value.trim();if(!text)return;state.messages.push({who:'user',text});state.messages.push({who:'agent',text:'这是预设的模拟回复，未调用 Codex。\n\n你的消息已记录在本页。示例任务图包含需求、接口、页面、集成与文档任务；你可以通过「查看生成的任务图」打开它，并添加 Task 或调整 Unit。\n\n当前不会根据消息内容自动生成新图。'});render();$('.messages').scrollTop=$('.messages').scrollHeight}
  return;
 }
 const unitEl=e.target.closest('[data-unit]');if(unitEl){const i=Number(unitEl.dataset.unit);openUnit=openUnit===i?-1:i;render()}
});
document.addEventListener('change',e=>{if(e.target.id==='concurrency')state.concurrency=Number(e.target.value);if(e.target.id==='traceFilter'){traceFilter=e.target.value;render()}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#modal').close()}});
render();
})();
</script>
</body>
