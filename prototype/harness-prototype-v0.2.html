(() => {
'use strict';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const templates=[
 {id:'worker',name:'Worker',kind:'agent',model:'codex · 默认模型',reasoning:'high',skills:'implement, verify',prompt:'根据任务目标完成实现，运行必要检查。遇到不确定信息时给相关成员发信；完成后提交候选版本。',codeWrite:true,tests:'write',reports:true,builtin:true},
 {id:'reviewer',name:'Reviewer',kind:'agent',model:'codex · 默认模型',reasoning:'high',skills:'code-review',prompt:'针对指定候选版本审查。核实风险，必要时新增验证测试。明确返回 approved 或 changes_requested，并附证据。',codeWrite:false,tests:'add',reports:true,builtin:true},
 {id:'explorer',name:'Explorer',kind:'agent',model:'codex · 默认模型',reasoning:'medium',skills:'explore',prompt:'调查现有实现，引用文件位置回答问题。将发现写入自己的报告，并通过 Mailbox 交给请求方。',codeWrite:false,tests:'read',reports:true,builtin:true},

];
let templateList=copy(templates), S, page='graph', selected='T02', inspectTab='members', graphView='graph', currentMail=null, mailFilter='all', mailUnit=null, mailDirection='inbox', currentSession='main', currentFile='graph.json', modalState=null, timer=null;

 if(scenario==='direct')S.tasks.forEach(t=>t.members=t.members.filter(u=>u.id!=='reviewer'));
 selected='T02';currentMail=null;mailUnit=null;mailDirection='inbox';currentSession='main';inspectTab='members';
 addLetter({from:'session/main',to:[`${graphId}/T02/worker`],title:'实现约束与验收',path:'.newharness/letters/L001.md',body:'请沿用现有的认证接口约定。先请 explorer 确认 token 的失效行为，再提交实现。',mode:'auto'},true);

function event(t,u,type,message,tool=null){const e={id:`E${++S.serial}`,tick:S.tick,task:t?.id||'graph',unit:u?.id||'',type,message,tool};S.events.push(e);return e;}
function pending(address){return S.letters.flatMap(l=>l.deliveries.filter(d=>d.to===address&&d.state==='queued').map(d=>({l,d})));}
function inputParts(t,u){return [
 {title:'01 · 模板与能力',text:u.config.kind==='agent'?`${u.config.name}\n${u.config.prompt}\nSkills: ${u.config.skills||'无'}\n实现写入: ${u.config.codeWrite?'允许':'禁止'} · 测试: ${u.config.tests} · 报告: ${u.config.reports?'自己的目录':'禁止'}`:`Command\n${u.config.prompt}`},
 {title:`02 · ${t.id}/task.md`,text:t.goal},
 {title:'03 · 成员初始指令',text:u.prompt||'（未设置额外指令）'},
 {title:'04 · 上游成果',text:t.deps.length?t.deps.map(id=>{const dep=findTask(id);return `${id} · ${dep.title}\n${dep.state==='done'?`已完成，候选 v${dep.revision} · .newharness/taskgraph/${graphId}/${id}/result.md`:'尚未完成：启动时解析已交付版本'}`;}).join('\n\n'):'无前置任务'},
 {title:'05 · 待投递 Letter',text:pending(addr(t,u)).map(({l})=>`[${l.id}] ${l.title}\nFrom: ${l.from}\nFile: ${l.path}\n${l.body}`).join('\n\n')||'暂无待投递信件'}
 ];}
function ensureSession(t,u){if(u.session)return S.sessions.find(s=>s.id===u.session);const id=`s-${t.id}-${u.id}`;u.session=id;const s={id,address:addr(t,u),config:copy(u.config),initialInput:inputParts(t,u),messages:[],turns:0};S.sessions.push(s);return s;}
function deliver(t,u,items,where){const s=ensureSession(t,u);items.forEach(({l,d})=>{d.state='delivered';d.at=`${s.id} · turn ${u.turns} · ${where}`;s.messages.push({who:'mailbox',text:`${l.id} · ${l.title}\nFrom: ${l.from}\n${l.path}\n\n${l.body}`});event(t,u,'mail.delivered',`${l.id} → ${where}`);});}
function startUnit(t,u,kind){if(u.job)return;const fresh=!u.session,s=ensureSession(t,u);u.turns++;s.turns=u.turns;u.state='running';u.job={kind,remaining:kind==='work'?3:kind==='review'?2:1};
 s.messages.push({who:'system',text:`Turn ${u.turns} · ${fresh?'首轮启动':'继续原 session'} · ${kind==='work'?`执行候选 v${t.revision+1}`:kind==='review'?`审查候选 v${t.revision}`:kind==='mail'?'处理来信（不改变 Task 完成状态）':kind==='command'?'执行命令':'调查现有实现'}`});
 if(fresh)s.messages.push({who:'input',text:s.initialInput.filter(x=>!x.title.startsWith('05')).map(x=>`${x.title}\n${x.text}`).join('\n\n')});
 deliver(t,u,pending(addr(t,u)),fresh?'首轮注入':'后续 turn');event(t,u,'unit.started',`${kind} · ${u.session} · turn ${u.turns}`);
}
function addLetter(data,seed=false){const l={id:`L${String(S.letters.length+1).padStart(3,'0')}`,...data,created:S.tick,deliveries:data.to.map(to=>({to,state:'queued',at:'等待接收时机'}))};S.letters.push(l);
 l.deliveries.filter(d=>d.to==='session/main').forEach(d=>{d.state='delivered';d.at='主控会话';S.sessions[0].messages.push({who:'mailbox',text:`${l.id} · ${l.title}\nFrom: ${l.from}\n${l.body}`});});
 if(!seed)event(null,null,'mail.sent',`${l.id} · ${l.title}`);return l;}
function toolCall(t,u){const kind=u.job.kind;if(kind==='mail'){u.cost+=.004;u.seconds+=.8;event(t,u,'model.completed','处理已自动注入的来信 · 无收信工具调用');return;}const name=kind==='review'||kind==='command'?'shell':kind==='explore'?'read_file':u.job.remaining===2&&u.config.codeWrite?'apply_patch':'shell';const input=name==='apply_patch'?`*** Update File: src/${t.id.toLowerCase()}.ts\n+ // 模拟候选版本 ${t.revision+1}`:name==='read_file'?'src/auth/session.ts':u.config.kind==='command'?u.config.prompt:'npm test -- --run';const duration=1.2+(S.tick%4)*.7,cost=u.config.kind==='command'?0:.006+S.tick%3*.002;u.calls++;u.seconds+=duration;u.cost+=cost;event(t,u,'tool.completed',`${name} · ${kind}`,{name,input,output:name==='apply_patch'?'演示补丁已记录；未修改磁盘文件。':'模拟输出：检查完成，exit code 0。',seconds:duration,cost,session:u.session});
 if(kind==='work'&&u.job.remaining===3&&t.revision===0){const explorer=t.members.find(m=>m.templateId==='explorer');if(explorer&&!explorer.session&&!pending(addr(t,explorer)).length)addLetter({from:addr(t,u),to:[addr(t,explorer)],title:'请确认 token 失效约定',path:`.newharness/letters/${t.id}-question.md`,body:'请调查现有接口如何表达 token 过期，将文件位置和结论回复给我。',mode:'auto'});}
}
function completeUnit(t,u){const kind=u.job.kind;u.job=null;u.state='idle';const s=ensureSession(t,u);let text='';
 if(kind==='work'){t.revision++;t.round++;t.approval=null;const reviewer=t.members.find(m=>m.templateId==='reviewer');text=`提交候选 v${t.revision}。${reviewer?'等待 reviewer 审查。':'未配置 reviewer，自行交付。'}`;event(t,u,'candidate.submitted',text);if(reviewer){t.state='reviewing';startUnit(t,reviewer,'review');}else finishTask(t);}
 else if(kind==='review'){if(S.scenario==='review'&&t.id==='T02'&&t.revision===1){text='changes_requested · 候选 v1 缺少 token 过期测试，请补齐后再提交。';event(t,u,'review.changes_requested',text);addLetter({from:addr(t,u),to:[`${graphId}/${t.id}/worker`],title:'补充过期场景测试',path:`.newharness/reports/${t.id}/review-v1.md`,body:text,mode:'auto'});if(t.round>=t.maxRounds){t.state='blocked';t.blockReason='已达到返修轮数上限';}else{t.state='working';startUnit(t,t.members.find(m=>m.templateId==='worker'),'work');}}else{text=`approved · 候选 v${t.revision} 已通过审查，新增验证测试随该版本交付。`;t.approval=t.revision;event(t,u,'review.approved',text);finishTask(t);}}
 else if(kind==='explore'){text='现有接口使用 401 表达 token 失效；请保持这一约定。报告已生成（模拟）。';addLetter({from:addr(t,u),to:[`${graphId}/${t.id}/worker`],title:'认证接口调查结论',path:`.newharness/reports/${t.id}/explorer/findings.md`,body:text,mode:'auto'});}
 else if(kind==='command'){text=`命令 ${u.config.prompt} 运行通过（模拟）。`;event(t,u,'command.passed',text);}
 else{text='已收到来信，回复已记录（预设模拟回复）。Task 的交付状态保持不变。';S.letters.forEach(l=>l.deliveries.filter(d=>d.to===addr(t,u)&&d.state==='delivered').forEach(d=>d.state='replied'));}
 s.messages.push({who:'agent',text});event(t,u,'unit.turn_completed',`Turn ${u.turns} 结束 · ${u.session}`);
}
function finishTask(t){t.state='done';event(t,null,'task.completed',`交付 v${t.revision}${t.approval?' · reviewer 已通过':' · worker 自行提交'}`);}
function step(){S.tick++;const jobs=allMembers().filter(({u})=>u.job).map(({t,u})=>({t,u}));
 for(const {t,u} of jobs){const steer=pending(addr(t,u)).filter(({l})=>l.mode!=='followup');if(steer.length)deliver(t,u,steer,'下一次模型输入');toolCall(t,u);u.job.remaining--;if(u.job.remaining<=0)completeUnit(t,u);}
 for(const t of S.tasks){if(!['done','waiting','blocked'].includes(t.state))t.seconds+=1.5;if(t.state==='preparing'){t.stage++;if(t.stage>=2){if(S.scenario==='conflict'&&t.id==='T04'&&!t.conflictResolved){t.state='blocked';t.blockReason='上游 T02 / T03 在 src/auth.ts 合并冲突';event(t,null,'preparation.blocked',t.blockReason);addLetter({from:`${graphId}/${t.id}/runtime`,to:['session/main'],title:'合并阻塞，请裁决',path:`.newharness/taskgraph/${t.id}/conflict.md`,body:t.blockReason,mode:'auto'});}else{t.state='working';event(t,null,'preparation.ready',t.checks?'依赖合并及启动检查通过':'依赖合并完成 · 跳过可选启动检查');startUnit(t,t.members.find(u=>u.templateId==='worker'),'work');if(t.startExplorer){const ex=t.members.find(u=>u.templateId==='explorer');if(ex)startUnit(t,ex,'explore');}t.members.filter(u=>u.config.kind==='command').forEach(u=>startUnit(t,u,'command'));}}}}
 const active=()=>S.tasks.filter(t=>['preparing','working','reviewing'].includes(t.state));
 for(const t of S.tasks){if(t.state==='waiting'&&t.deps.every(id=>findTask(id).state==='done')&&active().length<S.limit){if(!t.newWorktree&&active().some(x=>!x.newWorktree))continue;t.state='preparing';t.stage=0;event(t,null,'preparation.started',`${t.newWorktree?'创建独立 worktree':'取得基准 worktree 写入锁'} · 合并 ${t.deps.join(', ')||'graph baseline'}`);}}
 for(const {t,u,address} of allMembers()){if(u.config.kind==='agent'&&!u.job&&pending(address).length){if(u.session||t.state==='done'||(['working','reviewing'].includes(t.state)&&!['worker','reviewer'].includes(u.templateId)))startUnit(t,u,u.templateId==='explorer'&&!u.session?'explore':'mail');}}
 if(!active().length&&!allMembers().some(({u})=>u.job)){S.running=false;clearInterval(timer);timer=null;}
}
function toggleRun(){if(S.running){S.running=false;clearInterval(timer);timer=null;}else{S.running=true;step();if(S.running)timer=setInterval(()=>{step();render();},1500);}render();}

function graphCanvas(){const positions={T01:[4,137],T02:[38,42],T03:[38,186],T04:[72,137],T05:[4,281]};const pos=t=>positions[t.id]||[72,281+(Number(t.id.slice(1))-6)*130];const height=Math.max(398,430+(S.tasks.length-6)*130);return `<div class="canvas"><div class="world" style="height:${height}px"><svg class="edges" viewBox="0 0 1000 ${height}" preserveAspectRatio="none"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b5c5ab"/></marker></defs>${S.tasks.flatMap(t=>t.deps.map(id=>{const from=findTask(id),a=pos(from),b=pos(t);const x1=(a[0]+24)*10,y1=a[1]+52,x2=b[0]*10,y2=b[1]+52;return `<path d="M${x1} ${y1} C${x1+45} ${y1} ${x2-45} ${y2} ${x2} ${y2}" fill="none" stroke="${from.state==='done'?'#8caf7e':'#c7d3bf'}" stroke-width="1.4" marker-end="url(#arrow)"/>`;})).join('')}</svg>${S.tasks.map(t=>{const [x,y]=pos(t);return `<button class="node ${t.state} ${selected===t.id?'selected':''}" data-task="${t.id}" style="left:${x}%;top:${y}px"><div class="row between"><span class="mono tiny muted">${t.id}</span>${badge(t.state)}</div><h3>${esc(t.title)}</h3><div class="row between tiny muted"><span>${t.members.length} members</span><span>${t.newWorktree?'⑂ worktree':'共享基准'}</span></div><span class="bar" style="width:${t.state==='done'?100:t.state==='reviewing'?78:t.state==='working'?45:t.state==='preparing'?15:0}%"></span></button>`;}).join('')}</div></div>`;}

 return `<aside class="panel"><div class="tasksummary"><div class="row between"><span class="tiny mono muted">TASK / ${t.id}</span>${badge(t.state)}</div><h2>${esc(t.title)}</h2><p>${t.members.length} 个成员 · ${t.deps.length} 个依赖 · ${t.newWorktree?'独立 worktree':'Graph 基准 worktree'}</p></div><div class="tabs">${[['members','成员'],['rules','调度'],['config','配置'],['mail','来信']].map(([id,name])=>`<button class="${inspectTab===id?'active':''}" data-inspect="${id}">${name}</button>`).join('')}</div><div class="inspectbody">${t.state==='blocked'?`<div class="notice amber" style="margin-bottom:13px"><strong>Task 已阻塞</strong><p>${esc(t.blockReason)}</p><button class="btn small" style="margin-top:8px" data-action="resolve">${t.blockReason.includes('轮数')?'增加额度并继续返修':'模拟解决冲突并重新校验'}</button></div>`:''}${body}</div></aside>`;}
function graphPage(){return `<div class="intro"><div><div class="eyebrow">PROJECT WORKFLOW</div><h1>认证流程改造</h1><div class="subtitle">${graphId} &nbsp; / &nbsp; Task 依赖 DAG · 成员按事件协作</div></div>${controls()}</div>${metrics()}<div class="workspace"><div><div class="panel"><div class="panelhead"><div class="row"><strong>Task graph</strong><span class="badge">${S.tasks.length} nodes</span></div><div class="row"><div class="seg"><button data-view="graph" class="${graphView==='graph'?'active':''}">DAG</button><button data-view="list" class="${graphView==='list'?'active':''}">列表</button></div><button class="btn small" data-action="addTask" ${S.tick?'disabled':''}>＋ Task</button></div></div><div class="toolbar"><span>⑂ baseline <code>graph/auth-flow</code></span><span class="flex"></span><label>并发 <select id="concurrency" ${S.tick?'disabled':''}>${[1,2,3,4].map(n=>`<option ${n===S.limit?'selected':''}>${n}</option>`).join('')}</select></label><span>${S.running?'● 自动运行中':'Ⅱ 可单步观察'}</span></div>${graphView==='graph'?graphCanvas():taskTable()}<div class="canvasfoot row between"><span>点击 Task 查看成员与调度规则</span><span>◎ &nbsp; 所有操作均为模拟</span></div></div>${scenarioPanel()}${trace()}</div>${inspector()}</div>`;}
function mailboxPage(){
 const counts=mailUnit?{inbox:S.letters.filter(l=>l.to.includes(mailUnit)).length,sent:S.letters.filter(l=>l.from===mailUnit).length}:null;
 const letters=S.letters.filter(l=>mailUnit?(mailDirection==='inbox'?l.to.includes(mailUnit):l.from===mailUnit):(mailFilter==='all'||l.from.includes('/'+mailFilter+'/')||l.to.some(a=>a.includes('/'+mailFilter+'/'))));
 const l=letters.find(x=>x.id===currentMail)||letters[letters.length-1],owner=mailUnit?resolveAddress(mailUnit):null;
 const deliveredLabel=d=>({queued:'等待投递',delivered:'已注入',replied:'已处理'}[d.state]);
 return `<div class="intro"><div><div class="eyebrow">${mailUnit?'AGENT UNIT':'GRAPH'} / ${graphId}</div>${owner?.t?`<div class="unitcrumb"><button data-return-task="${owner.t.id}">${owner.t.id} · ${esc(owner.t.title)}</button> &nbsp; / &nbsp; ${esc(owner.u.id)}</div>`:''}<h1>${mailUnit?esc(owner.u.id)+' 的 Mailbox':'Mailbox'}</h1><p class="subtitle">${mailUnit?'收件与发件是同一份 Letter 记录的两个视图。':'Graph 内所有 Letter 的统一索引，可按成员查看收件与发件。'}</p></div><div class="row wrap">${mailUnit?'<button class="btn" data-action="allMail">查看 Graph 全部信件</button>':''}<button class="btn primary" data-action="compose">＋ 写一封 Letter</button></div></div>
 <div class="panel"><div class="mailidentity"><span class="tiny muted">Mailbox 归属</span><select id="mailUnit" aria-label="Mailbox 归属"><option value="">Graph · 全部成员</option>${allMembers().filter(x=>x.u.config.kind==='agent').map(x=>`<option value="${esc(x.address)}" ${x.address===mailUnit?'selected':''}>${x.t.id} / ${esc(x.u.id)}</option>`).join('')}</select>${mailUnit?`<code class="muted">${esc(mailUnit)}</code>`:'<span class="tiny muted">正文保存在文件中，Letter 保存地址与投递记录</span>'}</div>
 <div class="panelhead">${mailUnit?`<div class="seg"><button data-mail-direction="inbox" class="${mailDirection==='inbox'?'active':''}">↓ 收件箱 ${counts.inbox}</button><button data-mail-direction="sent" class="${mailDirection==='sent'?'active':''}">↑ 发件箱 ${counts.sent}</button></div>`:`<strong>${letters.length} 封信件 <span class="muted tiny">· Graph 共享</span></strong>`}<div class="row">${mailUnit?'':`<select id="mailFilter" style="font-size:11px;padding:5px"><option value="all">全部 Task</option>${S.tasks.map(t=>`<option value="${t.id}" ${mailFilter===t.id?'selected':''}>${t.id}</option>`).join('')}</select>`}<button class="btn small" data-action="step" ${S.running?'disabled':''}>推进投递 ▹</button></div></div>
 <div class="mail-layout"><div class="mail-list">${letters.slice().reverse().map(x=>{const ownDelivery=x.deliveries.find(d=>d.to===mailUnit);return `<button class="letter ${l?.id===x.id?'selected':''}" data-letter="${x.id}"><div class="row between"><span class="tiny muted">${x.id}</span><span class="badge">${x.mode}</span></div><h3>${esc(x.title)}</h3><div class="tiny muted">${mailUnit&&mailDirection==='sent'?'To '+x.to.map(esc).join('、'):'From '+esc(x.from)}</div><div class="unitmailbadge">${mailUnit&&mailDirection==='inbox'?deliveredLabel(ownDelivery):`${x.deliveries.filter(d=>d.state!=='queued').length} / ${x.to.length} 已投递`}</div></button>`;}).join('')||`<div class="empty">${mailDirection==='sent'?'还没有发出的 Letter':'还没有收到的 Letter'}<br>这里显示文件引用和投递状态</div>`}</div>
 <div class="mail-detail">${l?`<div class="row between"><h2>${esc(l.title)}</h2><span class="badge">${l.id}</span></div><p class="tiny muted" style="margin:10px 0 20px">From ${esc(l.from)}<br>发送于 ${(l.created*1.5).toFixed(1)}s · ${l.mode}</p><label class="field"><span>正文文件地址</span><code>${esc(l.path)}</code><span class="help">以下为绑定文件的模拟内容预览；收件箱 / 发件箱不各自保存一份正文。</span></label><pre>${esc(l.body)}</pre><h3 style="margin-top:20px">逐收件人投递记录</h3>${l.deliveries.map(d=>`<div class="delivery"><div><code>${esc(d.to)}${d.to===mailUnit?' · 当前成员':''}</code><div class="tiny muted">${esc(d.at)}</div></div><span class="badge ${d.state==='queued'?'':'done'}">${deliveredLabel(d)}</span></div>`).join('')}<button class="btn" style="margin-top:18px" data-action="reply" data-id="${l.id}">${mailUnit===l.from?'再次发信':'↩ 回复'}</button>`:'<div class="empty">选择一封 Letter 查看文件地址、内容和投递位置</div>'}</div></div></div>
 <div class="notice" style="margin-top:15px"><strong>auto</strong>：运行中注入下一次模型输入；尚未启动时等正式启动；已结束时继续原 session 处理。<br><strong>--steer</strong>：下一次可接收输入时注入。<strong>--followup</strong>：等当前 turn 结束再处理。均不跳过 DAG 依赖，不并发调用同一 session。</div>`;
}
function templatesPage(){return `<div class="intro"><div><div class="eyebrow">PERSONAL LIBRARY · CROSS PROJECT</div><h1>Agent templates</h1><p class="subtitle">保存默认能力和指令，Task 成员引用后可独立覆盖。</p></div><button class="btn primary" data-action="newTemplate">＋ 创建模板</button></div><div class="grid3">${templateList.map(t=>`<div class="card"><div class="row between" style="margin-top:0"><span class="avatar ${t.id}">${t.kind==='command'?'>_':t.name[0]}</span><span class="badge">${t.builtin?'内置默认':'自定义'} · ${t.kind==='command'?'Command':'Agent'}</span></div><h2>${esc(t.name)}</h2><p>${t.kind==='command'?'程序执行，无模型费用':`${esc(t.model)} / ${esc(t.reasoning)}`}</p><div style="margin:12px 0;min-height:43px">${t.skills.split(',').filter(s=>s.trim()).map(s=>`<span class="tag">${esc(s.trim())}</span>`).join('')||'<span class="tag">无 skills</span>'}</div><ul><li>实现代码：${t.codeWrite?'可写':'只读'}</li><li>测试：${{read:'只读',add:'可新增验证测试',write:'可写'}[t.tests]}</li><li>报告：${t.reports?'自己的报告目录':'只读'}</li></ul><div class="row"><button class="btn" data-template="${t.id}">查看 / 编辑</button><button class="btn" data-duplicate="${t.id}">复制</button></div></div>`).join('')}</div><div class="notice" style="margin-top:17px">跨项目模板在这里集中维护。修改模板不会回写已有成员；成员可显式重新应用模板。原型中的模板只保存在当前页面内存。</div>`;}
function sessionsPage(){const s=S.sessions.find(x=>x.id===currentSession)||S.sessions[0];return `<div class="intro"><div><div class="eyebrow">PROJECT SESSIONS</div><h1>Sessions</h1><p class="subtitle">一次成员身份，一个默认复用的 session；turn 单独记录。</p></div><button class="btn" data-action="main">打开主控会话</button></div><div class="panel sessionlayout"><div class="sessionlist">${S.sessions.map(x=>`<button class="sessionitem ${x.id===s.id?'active':''}" data-session="${x.id}"><strong style="font-size:11px">${x.id==='main'?'主控 · 自由对话':esc(x.id)}</strong><small>${esc(x.address)}<br>${x.turns} turns</small></button>`).join('')}</div><div><div class="panelhead"><div><strong>${esc(s.id)}</strong><div class="tiny muted">${esc(s.address)}</div></div>${s.id!=='main'?'<button class="btn small" data-action="sessionInput">首轮输入快照</button>':'<span class="badge">直接聊天</span>'}</div><div class="messages">${s.messages.map(m=>`<div class="bubble ${m.who}"><div class="who">${esc(m.who.toUpperCase())} · ${esc(s.id)}</div>${esc(m.text)}</div>`).join('')}</div><div class="compose">${s.id==='main'?'<textarea id="chatInput" aria-label="主控消息" placeholder="和主控对话（预设模拟回复）"></textarea><div class="row between" style="margin-top:9px"><span class="tiny muted">不实际生成代码或任务图</span><button class="btn primary" data-action="chatSend">发送 ↑</button></div>':`<div class="row between"><span class="tiny muted">给此成员发送可追踪的消息</span><button class="btn" data-action="sessionMail" data-address="${esc(s.address)}">✉ 发信</button></div>`}</div></div></div>`;}
function fileEntries(){const files={'graph.json':JSON.stringify({id:graphId,baseline:'graph/auth-flow',concurrency:S.limit,tasks:S.tasks.map(t=>({id:t.id,deps:t.deps,state:t.state,new_worktree:t.newWorktree,members:t.members.map(u=>u.id)}))},null,2)};for(const t of S.tasks){files[`${t.id}/task.md`]=t.goal;files[`${t.id}/config.json`]=JSON.stringify({new_worktree:t.newWorktree,maxRounds:t.maxRounds,members:t.members.map(u=>({id:u.id,template:u.templateId,config:u.config,prompt:u.prompt}))},null,2);}S.letters.forEach(l=>files[`letters/${l.id}.md`]=l.body);return files;}
function filesPage(){const files=fileEntries(),key=files[currentFile]!==undefined?currentFile:'graph.json';return `<div class="intro"><div><div class="eyebrow">PROJECT ARTIFACTS</div><h1>Project files</h1><p class="subtitle">.newharness 中的预期目录与内容，当前为内存预览。</p></div><button class="btn" data-action="export">↓ 导出运行记录</button></div><div class="panel filelayout"><div class="filetree"><div class="tiny muted" style="margin:0 7px 10px">.newharness/taskgraph/${graphId}/</div>${Object.keys(files).map(k=>`<button data-file="${esc(k)}" class="${key===k?'active':''}">${esc(k)}</button>`).join('')}</div><div class="filecontent"><span class="tiny muted mono">${esc(key)}</span><pre>${esc(files[key])}</pre></div></div>`;}
function render(){const names={graph:'Task graphs',mailbox:'Mailbox',templates:'Agent templates',sessions:'Sessions',files:'Project files',logs:'Run logs'};const scroll=$('.canvas')?{left:$('.canvas').scrollLeft,top:$('.canvas').scrollTop}:null;const messageScroll=$('.messages')?.scrollTop;const focused=document.activeElement,id=focused?.id,value=focused?.value;
 const content=page==='graph'?graphPage():page==='mailbox'?mailboxPage():page==='templates'?templatesPage():page==='sessions'?sessionsPage():page==='files'?filesPage():`<div class="intro"><div><div class="eyebrow">OBSERVABILITY</div><h1>Run logs</h1><p class="subtitle">每条调用的输入、输出、session、时间和模拟费用。</p></div>${controls()}</div>${metrics()}${trace(true)}`;
 $('#app').innerHTML=`<div class="app">${nav()}<main><div class="topbar"><div class="crumb">Projects &nbsp; / &nbsp; new-harness &nbsp; / &nbsp; <strong>${names[page]}</strong></div><span class="proto"><span class="offline"></span>交互原型 0.2 · MOCK</span></div><div class="page">${content}<div class="appfoot"><span>LOCAL FIRST &nbsp; / &nbsp; YOUR WORKSPACE, YOUR AGENTS</span><span>未接入 Codex · 时间 / 费用 / 文件均为演示数据</span></div></div></main></div>`;
 if(scroll&&$('.canvas')){$('.canvas').scrollLeft=scroll.left;$('.canvas').scrollTop=scroll.top;}if(messageScroll!==undefined&&$('.messages'))$('.messages').scrollTop=messageScroll;if(id&&document.getElementById(id)&&!$('#modal').contains(focused)){const el=document.getElementById(id);if(value!==undefined)el.value=value;el.focus();}
}
function showModal(title,body,footer='',wide=true){const dialog=$('#modal');dialog.style.width=wide?'760px':'510px';dialog.innerHTML=`<header><div class="row between"><div><div class="eyebrow">NEW HARNESS / PROTOTYPE 0.2</div><h2>${title}</h2></div><button class="close" data-action="close" aria-label="关闭">×</button></div></header><section>${body}</section><footer><button class="btn" data-action="close">关闭</button>${footer}</footer>`;if(!dialog.open)dialog.showModal();}
function configFields(c,locked=false){return `<fieldset ${locked?'disabled':''} style="border:0;padding:0;margin:0"><div class="grid2"><label class="field"><span>类型</span><select id="cfgKind"><option value="agent" ${c.kind==='agent'?'selected':''}>Agent · 使用 LLM</option><option value="command" ${c.kind==='command'?'selected':''}>Command · 程序执行</option></select></label><label class="field"><span>名称</span><input id="cfgName" value="${esc(c.name)}" maxlength="35"></label></div><div id="agentFields" class="${c.kind==='command'?'hidden':''}"><div class="grid2"><label class="field"><span>Model · 演示配置，可自由填写</span><input id="cfgModel" value="${esc(c.model)}" placeholder="模型标识"></label><label class="field"><span>Reasoning</span><select id="cfgReasoning">${['low','medium','high','xhigh'].map(r=>`<option ${r===c.reasoning?'selected':''}>${r}</option>`).join('')}</select></label></div><label class="field"><span>Skills · 逗号分隔</span><input id="cfgSkills" value="${esc(c.skills)}" placeholder="implement, verify"></label></div><label class="field"><span id="promptLabel">${c.kind==='command'?'执行命令':'模板指令'}</span><textarea id="cfgPrompt">${esc(c.prompt)}</textarea></label><div class="grid2"><div><span class="tiny muted">工作区权限（模拟）</span><label class="checkrow"><input type="checkbox" id="cfgCode" ${c.codeWrite?'checked':''}>允许修改实现代码</label><label class="checkrow"><input type="checkbox" id="cfgReports" ${c.reports?'checked':''}>可写自己的报告目录</label></div><label class="field"><span>测试文件权限</span><select id="cfgTests"><option value="read" ${c.tests==='read'?'selected':''}>只读</option><option value="add" ${c.tests==='add'?'selected':''}>允许新增验证测试</option><option value="write" ${c.tests==='write'?'selected':''}>允许新增及修改</option></select></label></div><p class="permissionnote">权限属于成员配置，不由成员名称决定。原型仅展示配置，不执行真实沙箱隔离。</p></fieldset>`;}
function readConfig(base){return {...base,name:$('#cfgName').value.trim()||base.name,kind:$('#cfgKind').value,model:$('#cfgModel').value.trim(),reasoning:$('#cfgReasoning').value,skills:$('#cfgSkills').value.trim(),prompt:$('#cfgPrompt').value,codeWrite:$('#cfgCode').checked,reports:$('#cfgReports').checked,tests:$('#cfgTests').value};}
function memberModal(t,u,tab='config'){modalState={type:'member',task:t.id,unit:u.id,tab};const locked=configLocked(t);const session=u.session?S.sessions.find(s=>s.id===u.session):null;const tabs=`<div class="row wrap" style="margin-bottom:17px"><div class="seg"><button data-membertab="config" class="${tab==='config'?'active':''}">配置</button><button data-membertab="input" class="${tab==='input'?'active':''}">首轮输入</button><button data-membertab="permissions" class="${tab==='permissions'?'active':''}">写入边界</button><button data-membertab="usage" class="${tab==='usage'?'active':''}">运行统计</button></div><span class="flex"></span>${badge(u.state)}<span class="tiny mono muted">${esc(addr(t,u))}</span></div>`;
 let body='';if(tab==='config')body=`<div class="notice" style="margin-bottom:15px">${locked?'Task 已启动，此处显示冻结的成员配置。':'从跨项目模板继承默认值，在此覆盖只影响当前成员。'}</div><div class="row" style="margin-bottom:16px"><label class="tiny muted" for="memberTemplate">模板</label><select id="memberTemplate" ${locked?'disabled':''}>${templateList.map(x=>`<option value="${x.id}" ${x.id===u.config.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button class="btn" data-action="applyTemplate" ${locked?'disabled':''}>重新应用</button></div>${configFields(u.config,locked)}<label class="field" style="margin-top:17px"><span>成员初始 prompt · 针对此 Task</span><textarea id="memberPrompt" ${locked?'disabled':''}>${esc(u.prompt)}</textarea></label>`;
 if(tab==='input'){const parts=session?.initialInput||inputParts(t,u);body=`<div class="notice" style="margin-bottom:15px">${session?'以下是启动时保存的首轮输入快照，之后的来信见 session。':'启动器将以下内容自动组装到首轮输入。上游结果与待投递 Letter 在启动时解析。'}</div>${parts.map(p=>`<div class="inputblock"><h3>${esc(p.title)}</h3><pre>${esc(p.text)}</pre></div>`).join('')}`;}
 if(tab==='permissions')body=`<div class="notice">实现写入：${u.config.codeWrite?'允许':'只读'} · 测试：${{read:'只读',add:'仅新增验证测试',write:'可新增及修改'}[u.config.tests]}</div><table class="permissions" style="margin-top:15px"><tr><th>区域</th><th>当前成员</th></tr><tr><td>实现代码与配置</td><td>${u.config.codeWrite?'读 / 写':'只读'}</td></tr><tr><td>已有测试</td><td>${u.config.tests==='write'?'读 / 写':'只读'}</td></tr><tr><td>新增验证测试</td><td>${u.config.tests==='read'?'禁止写入':'允许'}</td></tr><tr><td>.newharness/reports/${t.id}/${u.id}/</td><td>${u.config.reports?'读 / 写':'只读'}</td></tr><tr><td>其他成员报告</td><td>只读</td></tr></table><p class="hint">审查期间固定候选版本，worker 等待审查结果后再改代码。新增测试会计入待交付内容。模型权限与运行时隔离的真实实现留待后续验证。</p>`;
 if(tab==='usage'){const events=S.events.filter(e=>e.task===t.id&&e.unit===u.id);body=`<div class="metrics unitusage"><div class="metric"><div class="tiny muted">累计执行耗时</div><div class="value">${u.seconds.toFixed(1)}<small>s</small></div></div><div class="metric"><div class="tiny muted">TOOL CALLS</div><div class="value">${u.calls}</div></div><div class="metric"><div class="tiny muted">模拟费用</div><div class="value">$${u.cost.toFixed(3)}</div></div><div class="metric"><div class="tiny muted">TURNS</div><div class="value">${u.turns}</div></div></div><div class="notice">统计包含该 Unit 在本次 Graph 运行中的初次执行、返修和来信处理。耗时为模拟执行累计，不含排队或待命；Graph 顶部时间是整图经过的模拟时间。数值仅供原型演示。</div><div class="row between" style="margin:17px 0 8px"><h3>此成员的调用与事件</h3><button class="btn small" data-membertab="usage">刷新统计</button></div>${events.length?`<div class="tracebody">${events.slice().reverse().map(e=>`<button class="traceitem" data-event="${e.id}"><span class="muted">${(e.tick*1.5).toFixed(1)}s</span><code>${e.tool?e.tool.name:'event'}</code><span class="msg">${esc(e.message)}</span><span class="muted">${e.tool?e.tool.seconds.toFixed(1)+'s':'↗'}</span></button>`).join('')}</div>`:'<div class="empty">此成员尚未执行</div>'}`;}
 showModal(`${esc(t.id)} / ${esc(u.id)}`,tabs+body+`<div class="modalstats"><span>Session: ${u.session||'尚未创建'}</span><span>${u.turns} turns</span><span>${u.calls} calls</span><span>${u.seconds.toFixed(1)}s</span><span>$${u.cost.toFixed(3)} 模拟</span></div>`,`${!locked&&u.templateId!=='worker'?'<button class="btn danger" data-action="removeMember">移除成员</button>':''}${u.session?'<button class="btn" data-action="openMemberSession">查看 session ↗</button>':''}<button class="btn" data-action="memberMail">✉ 发信</button>${tab==='config'&&!locked?'<button class="btn primary" data-action="saveMember">保存成员配置</button>':''}`);
}
function templateModal(id,duplicate=false){const base=id?templateList.find(x=>x.id===id):{...templates[0],id:'',name:'新模板',builtin:false};const c=copy(base);if(duplicate){c.id='';c.name+=' 副本';c.builtin=false;}modalState={type:'template',config:c};showModal(c.id?`模板 · ${esc(c.name)}`:'创建跨项目模板',configFields(c),'<button class="btn primary" data-action="saveTemplate">保存模板</button>');}
function composeModal(to=[],reply=null){modalState={type:'letter'};const choices=[{address:'session/main',label:'主控会话'},...allMembers().filter(x=>x.u.config.kind==='agent').map(x=>({address:x.address,label:`${x.t.id} / ${x.u.id}`}))];const fromOptions=choices;showModal(reply?'回复 Letter':'写一封 Letter',`<div class="grid2"><label class="field"><span>发送者</span><select id="letterFrom">${fromOptions.map(x=>`<option value="${esc(x.address)}">${esc(x.label)}</option>`).join('')}</select></label><label class="field"><span>投递时机</span><select id="letterMode"><option value="auto">auto · 按当前状态投递</option><option value="steer">--steer · 下一次模型输入</option><option value="followup">--followup · 当前 turn 之后</option></select></label></div><label class="field"><span>收件人 · 可多选</span><div class="mailtargets">${choices.map(x=>`<label class="checkrow"><input type="checkbox" name="recipient" value="${esc(x.address)}" ${to.includes(x.address)?'checked':''}><span>${esc(x.label)}<br><span class="tiny muted mono">${esc(x.address)}</span></span></label>`).join('')}</div></label><label class="field"><span>标题 · 最多 20 个字符</span><input id="letterTitle" maxlength="40" value="${reply?esc(('回复：'+reply.title).slice(0,20)):''}" placeholder="例如：请确认 token 过期行为"><span class="help" id="titleCount">${reply?Math.min(20,reply.title.length+3):0} / 20</span></label><label class="field"><span>正文文件路径</span><input id="letterPath" value=".newharness/letters/L${String(S.letters.length+1).padStart(3,'0')}.md"></label><label class="field"><span>文件内容预览 · 模拟编辑</span><textarea id="letterBody" placeholder="写入要交给成员的具体信息或问题。">${reply?'收到。请按上述约定继续。':''}</textarea></label><div class="notice">尚未启动的成员等正式启动时收信；已结束的成员继续原 session。来信不会跳过依赖，也不会自动解除 Task 阻塞。</div>`, '<button class="btn primary" data-action="sendLetter">投信 →</button>');}
function taskModal(t){const locked=t&&configLocked(t);modalState={type:t?'editTask':'newTask',task:t?.id};showModal(t?`${t.id} · Task 配置`:'添加 Task',`<fieldset ${locked?'disabled':''} style="border:0;padding:0;margin:0"><label class="field"><span>任务名称</span><input id="taskTitle" value="${esc(t?.title||'')}" placeholder="例如：接入监控告警"></label><label class="field"><span>task.md · 由启动器注入成员首轮</span><textarea id="taskGoal" style="min-height:140px">${esc(t?.goal||'# 任务目标\n\n\n# 验收标准\n\n')}</textarea></label>${!t?`<label class="field"><span>依赖任务 · 只能引用已有 Task，保持 DAG</span><div class="row wrap">${S.tasks.map(x=>`<label class="checkrow"><input type="checkbox" name="dependency" value="${x.id}">${x.id}</label>`).join('')}</div></label><label class="checkrow"><input id="taskReview" type="checkbox" checked>配置 reviewer，审查通过后交付</label><label class="checkrow"><input id="taskExplore" type="checkbox">配置 explorer 成员</label>`:''}<label class="checkrow"><input id="taskWorktree" type="checkbox" ${!t||t.newWorktree?'checked':''}>new_worktree · 独立工作区，允许并行</label><label class="checkrow"><input id="taskChecks" type="checkbox" ${!t||t.checks?'checked':''}>preparation 后执行启动检查</label><label class="checkrow"><input id="startExplorer" type="checkbox" ${t?.startExplorer?'checked':''}>preparation 后并行激活 explorer（已配置时）</label><label class="field" style="margin-top:14px"><span>最大提交 / 返修轮数</span><input type="number" id="maxRounds" min="1" max="10" value="${t?.maxRounds||3}"></label></fieldset><div class="notice">共享 Graph 基准 worktree 的 Task 会串行取得写入权。返修和再审默认复用原 session。</div>`,locked?'':'<button class="btn primary" data-action="saveTask">保存 Task</button>');}
function addMemberModal(){const t=findTask(selected);modalState={type:'addMember',task:t.id};const options=templateList.filter(x=>!t.members.some(u=>u.templateId===x.id)&&x.id!=='worker');showModal('添加并列成员',`<label class="field"><span>选择模板</span><select id="addTemplate">${options.map(x=>`<option value="${x.id}">${esc(x.name)} · ${x.kind}</option>`).join('')}</select></label><p class="hint">Reviewer 在候选提交时激活；Explorer 可由来信或初始配置激活；Command 在 preparation 完成后执行。自定义 Agent 可由来信激活。</p>`,options.length?'<button class="btn primary" data-action="confirmMember">添加成员</button>':'',false);}
document.addEventListener('click',e=>{
 const el=e.target.closest('button,tr[data-task]');if(!el||el.disabled)return;const d=el.dataset;
 if(d.page){page=d.page;if(page==='mailbox'){mailUnit=null;mailFilter='all';currentMail=null;}render();return;}if(d.task){selected=d.task;render();return;}if(d.inspect){inspectTab=d.inspect;render();return;}if(d.view){graphView=d.view;render();return;}
 if(d.unitMail){mailUnit=d.unitMail;mailDirection=d.direction||'inbox';currentMail=null;page='mailbox';$('#modal').close();render();return;}
 if(d.mailDirection){mailDirection=d.mailDirection;currentMail=null;render();return;}
 if(d.returnTask){selected=d.returnTask;page='graph';inspectTab='members';render();return;}
 if(d.memberusage){const [tid,uid]=d.memberusage.split('/');const t=findTask(tid);memberModal(t,t.members.find(u=>u.id===uid),'usage');return;}
 if(d.scenario){init(d.scenario);render();toast('场景已重置，可点击 Run graph 或单步');return;}
 if(d.member){const [tid,uid]=d.member.split('/');const t=findTask(tid);memberModal(t,t.members.find(u=>u.id===uid));return;}
 if(d.membertab){const t=findTask(modalState.task);memberModal(t,t.members.find(u=>u.id===modalState.unit),d.membertab);return;}
 if(d.template){templateModal(d.template);return;}if(d.duplicate){templateModal(d.duplicate,true);return;}
 if(d.letter){currentMail=d.letter;if(page!=='mailbox'){mailUnit=null;mailFilter='all';}page='mailbox';render();return;}if(d.session){currentSession=d.session;render();return;}if(d.file){currentFile=d.file;render();return;}
 if(d.event){const eventItem=S.events.find(x=>x.id===d.event);showModal(esc(eventItem.type),`<div class="modalstats"><span>${eventItem.task}/${eventItem.unit}</span><span>${(eventItem.tick*1.5).toFixed(1)}s · 模拟时间</span><span>${eventItem.id}</span></div><p style="margin-bottom:15px">${esc(eventItem.message)}</p>${eventItem.tool?`<div class="notice">Session: ${esc(eventItem.tool.session)}<br>耗时 ${eventItem.tool.seconds.toFixed(1)}s · 模拟费用 $${eventItem.tool.cost.toFixed(3)}</div><h3 style="margin:15px 0 7px">输入</h3><pre class="terminal">${esc(eventItem.tool.input)}</pre><h3>输出</h3><pre>${esc(eventItem.tool.output)}</pre>`:'<p class="hint">这是程序事件，不产生模型费用。</p>'}`);return;}
 const a=d.action;if(!a)return;
 if(a==='close'){$('#modal').close();modalState=null;return;}
 if(a==='run'){toggleRun();return;}if(a==='step'){step();render();return;}if(a==='reset'){init(S.scenario);render();toast('已重置为示例配置；模板库保留');return;}if(a==='export'){exportState();return;}
 if(a==='allMail'){mailUnit=null;currentMail=null;mailFilter='all';render();return;}
 if(a==='compose'){composeModal();if(mailUnit)$('#letterFrom').value=mailUnit;return;}if(a==='mailDemo'){composeModal([`${graphId}/${selected}/worker`]);$('#letterTitle').value='补充一个验收条件';$('#letterBody').value='请验证 token 过期时返回 401，并保留对应测试证据。';$('#titleCount').textContent='9 / 20';return;}
 if(a==='reply'){const l=S.letters.find(x=>x.id===d.id);const validFrom=l.from==='session/main'||allMembers().some(x=>x.address===l.from);composeModal(mailUnit===l.from?l.to:validFrom?[l.from]:['session/main'],l);if(mailUnit)$('#letterFrom').value=mailUnit;return;}
 if(a==='sendLetter'){const to=Array.from(document.querySelectorAll('[name=recipient]:checked')).map(x=>x.value),title=$('#letterTitle').value.trim(),body=$('#letterBody').value.trim(),path=$('#letterPath').value.trim();if(!to.length||!title||!body||!path){toast('请填写收件人、标题、文件路径和正文');return;}if([...title].length>20){toast('标题最多 20 个字符');return;}const l=addLetter({from:$('#letterFrom').value,to,title,path,body,mode:$('#letterMode').value});currentMail=l.id;$('#modal').close();page='mailbox';mailFilter='all';if(mailUnit){if(l.from===mailUnit)mailDirection='sent';else if(l.to.includes(mailUnit))mailDirection='inbox';else mailUnit=null;}render();toast('已存入 Mailbox；自动运行或单步时按收件人状态投递');return;}
 if(a==='newTemplate'){templateModal(null);return;}
 if(a==='saveTemplate'){const c=readConfig(modalState.config);if(c.kind==='agent'&&!c.model){toast('请填写 Agent 模型');return;}if(c.id){templateList[templateList.findIndex(x=>x.id===c.id)]=c;}else{c.id=`custom-${templateList.length+1}`;c.builtin=false;templateList.push(c);}$('#modal').close();render();toast('已保存模板，仅影响后续引用');return;}
 if(a==='saveMember'){const t=findTask(modalState.task),u=t.members.find(x=>x.id===modalState.unit);if(configLocked(t)){toast('Task 已启动，配置已冻结');return;}const c=readConfig(u.config);if(['worker','reviewer'].includes(u.templateId)&&c.kind!=='agent'){toast('当前交付规则需要 Agent 类型的 worker / reviewer');return;}if(c.kind==='agent'&&!c.model){toast('请填写 Agent 模型');return;}u.config=c;u.prompt=$('#memberPrompt').value;$('#modal').close();render();toast('已保存此成员的覆盖配置');return;}
 if(a==='applyTemplate'){const t=findTask(modalState.task),u=t.members.find(x=>x.id===modalState.unit),template=templateList.find(x=>x.id===$('#memberTemplate').value);if(configLocked(t))return;if(['worker','reviewer'].includes(u.templateId)&&template.kind!=='agent'){toast('此成员需使用 Agent 模板');return;}u.config=copy(template);memberModal(t,u);toast('模板默认值已应用到当前成员');return;}
 if(a==='memberMail'){composeModal([`${graphId}/${modalState.task}/${modalState.unit}`]);return;}
 if(a==='removeMember'){const t=findTask(modalState.task);if(configLocked(t))return;const u=t.members.find(x=>x.id===modalState.unit);if(u.templateId==='worker')return;t.members=t.members.filter(x=>x.id!==u.id);$('#modal').close();render();toast('已移除此成员；完成条件已同步更新');return;}
 if(a==='openMemberSession'){const t=findTask(modalState.task),u=t.members.find(x=>x.id===modalState.unit);currentSession=u.session;page='sessions';$('#modal').close();render();return;}
 if(a==='main'){currentSession='main';page='sessions';render();return;}
 if(a==='sessionInput'){const s=S.sessions.find(x=>x.id===currentSession);showModal('首轮输入快照',s.initialInput.map(p=>`<div class="inputblock"><h3>${esc(p.title)}</h3><pre>${esc(p.text)}</pre></div>`).join(''));return;}
 if(a==='sessionMail'){composeModal([d.address]);return;}
 if(a==='chatSend'){const text=$('#chatInput').value.trim();if(!text)return;S.sessions[0].messages.push({who:'user',text},{who:'agent',text:'已记录你的消息（预设回复，未调用模型）。\n\n你可以进入 Task graph 调整成员和配置，或通过 Mailbox 发送具体任务信息。本原型不会根据聊天内容自动生成任务图。'});S.sessions[0].turns++;render();$('.messages').scrollTop=$('.messages').scrollHeight;return;}
 if(a==='addTask'){taskModal(null);return;}if(a==='editTask'){taskModal(findTask(selected));return;}
 if(a==='taskFile'){const t=findTask(selected);showModal(`${t.id}/task.md`,`<pre>${esc(t.goal)}</pre>`);return;}
 if(a==='saveTask'){const title=$('#taskTitle').value.trim();if(!title){toast('请填写任务名称');return;}const max=Number($('#maxRounds').value);if(!Number.isInteger(max)||max<1||max>10){toast('返修轮数应为 1–10');return;}let t=modalState.task?findTask(modalState.task):null;if(t&&configLocked(t)){toast('Task 已启动，配置已冻结');return;}if(!t){t=makeTask(`T${String(S.tasks.length+1).padStart(2,'0')}`,title,Array.from(document.querySelectorAll('[name=dependency]:checked')).map(x=>x.value),$('#taskReview').checked,$('#taskExplore').checked);S.tasks.push(t);}t.title=title;t.goal=$('#taskGoal').value;t.newWorktree=$('#taskWorktree').checked;t.checks=$('#taskChecks').checked;t.startExplorer=$('#startExplorer').checked;t.maxRounds=max;selected=t.id;$('#modal').close();render();toast('Task 配置已保存');return;}
 if(a==='addMember'){addMemberModal();return;}if(a==='confirmMember'){const t=findTask(modalState.task);if(configLocked(t)){toast('Task 已启动，无法新增成员');return;}const id=$('#addTemplate').value;t.members.push(unit(id,id));$('#modal').close();render();toast('成员已加入 Task');return;}
 if(a==='resolve'){const t=findTask(selected);if(t.blockReason.includes('轮数')){t.maxRounds++;t.state='working';startUnit(t,t.members.find(u=>u.templateId==='worker'),'work');}else{t.conflictResolved=true;t.state='preparing';t.stage=0;}event(t,null,'block.resolved','用户显式恢复，继续校验 / 返修');render();toast('已模拟解决阻塞，点击运行或单步继续');return;}
});
document.addEventListener('change',e=>{if(e.target.id==='concurrency')S.limit=Number(e.target.value);if(e.target.id==='mailFilter'){mailFilter=e.target.value;render();}if(e.target.id==='mailUnit'){mailUnit=e.target.value||null;mailDirection='inbox';currentMail=null;mailFilter='all';render();}if(e.target.id==='cfgKind'){$('#agentFields').classList.toggle('hidden',e.target.value==='command');$('#promptLabel').textContent=e.target.value==='command'?'执行命令':'模板指令';}});
document.addEventListener('input',e=>{if(e.target.id==='letterTitle'){const n=[...e.target.value].length;$('#titleCount').textContent=`${n} / 20${n>20?' · 超出限制':''}`;}});
init();render();
})();
</script></body></html>
